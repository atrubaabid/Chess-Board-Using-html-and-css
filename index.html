<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <table>
        <!-- Row 1 -->
        <tr>
            <td class="black">♜</td>
            <td class="black">♞</td>
            <td class="black">♝</td>
            <td class="black">♛</td>
            <td class="black">♚</td>
            <td class="black">♝</td>
            <td class="black">♞</td>
            <td class="black">♜</td>
        </tr>

        <!-- Row 2 -->
        <tr>
            <td class="black">♟</td>
            <td class="black">♟</td>
            <td class="black">♟</td>
            <td class="black">♟</td>
            <td class="black">♟</td>
            <td class="black">♟</td>
            <td class="black">♟</td>
            <td class="black">♟</td>
        </tr>

        <!-- Empty Rows -->
        <tr>
            <td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td>
        </tr>

        <tr>
            <td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td>
        </tr>

        <tr>
            <td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td>
        </tr>

        <tr>
            <td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td>
        </tr>

        <!-- White Row 1 -->
        <tr>
            <td class="white">♙</td>
            <td class="white">♙</td>
            <td class="white">♙</td>
            <td class="white">♙</td>
            <td class="white">♙</td>
            <td class="white">♙</td>
            <td class="white">♙</td>
            <td class="white">♙</td>
        </tr>

        <!-- White Row 2 -->
        <tr>
            <td class="white">♖</td>
            <td class="white">♘</td>
            <td class="white">♗</td>
            <td class="white">♕</td>
            <td class="white">♔</td>
            <td class="white">♗</td>
            <td class="white">♘</td>
            <td class="white">♖</td>
        </tr>
    </table>

</body>
</html>
